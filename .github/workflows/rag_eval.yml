name: RAG Eval on RAG Changes

# Manual only: the eval needs a populated vector store plus ANTHROPIC_API_KEY /
# AWS secrets, none of which exist in a fresh CI runner (it always scored 0.0).
on:
  workflow_dispatch:
    inputs:
      n_samples:
        description: 'Number of eval samples'
        default: '10'
        required: false

jobs:
  eval:
    name: RAGAS Evaluation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('pyproject.toml') }}

      - name: Install project
        run: |
          pip install --upgrade pip
          pip install -e "."

      - name: Run RAG eval (10 samples for CI speed)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-2
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_PROVIDER: anthropic
          EMBEDDING_MODE: local
          GUARDRAILS_ENABLED: 'true'
          # DATABASE_URL: not set — eval uses mock retrieval if DB unavailable
        run: |
          python evaluation/eval_runner.py \
            --n-samples ${{ github.event.inputs.n_samples || '10' }} \
            --fail-below 0.60

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rag-eval-report
          path: "*.json"
          if-no-files-found: ignore
