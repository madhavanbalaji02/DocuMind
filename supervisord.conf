[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:postgres]
command=gosu postgres /usr/lib/postgresql/15/bin/postgres -D /data/postgres
autostart=true
autorestart=true
startretries=3
startsecs=3
stderr_logfile=/var/log/supervisor/postgres.err.log
stdout_logfile=/var/log/supervisor/postgres.out.log
priority=10

[program:api]
; Wait until postgres is accepting connections before starting uvicorn
command=bash -c "until pg_isready -h localhost -p 5432 -U documind 2>/dev/null; do sleep 2; done && uvicorn src.api.main:app --host 0.0.0.0 --port 8888 --workers 1"
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=10
stderr_logfile=/var/log/supervisor/api.err.log
stdout_logfile=/var/log/supervisor/api.out.log
priority=20

[program:streamlit]
command=streamlit run src/ui/app.py --server.port 7860 --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
directory=/app
autostart=true
autorestart=true
startretries=5
startsecs=5
stderr_logfile=/var/log/supervisor/streamlit.err.log
stdout_logfile=/var/log/supervisor/streamlit.out.log
priority=30
environment=API_BASE_URL="http://127.0.0.1:8888"
